[project]
name = "rag-me"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aiden-Domochevski", email = "salahahadaf20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-me = "rag_me:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
